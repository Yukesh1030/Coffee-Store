<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — STACKLY COFFEE</title>
  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="assets/favicon.webp">
  <meta name="description" content="Sign in to your STACKLY account to manage coffee orders, subscriptions, and profile.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">

  <!-- Preloader -->
  <div id="preloader">
    <img src="assets/Brand-logo.webp" alt="STACKLY" class="preloader-logo">
    <div class="preloader-steam-container">
      <div class="preloader-steam-line"></div>
      <div class="preloader-steam-line"></div>
      <div class="preloader-steam-line"></div>
    </div>
  </div>

  <!-- Header with Back to Home & Brand Logo -->
  <header class="auth-header">
    <a href="404.html" class="auth-back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
    <a href="index.html">
        <img src="assets/Brand-logo.webp" alt="STACKLY" class="auth-logo">
    </a>
  </header>

  <!-- Auth Card Container -->
  <main class="auth-card-container">
    <div class="auth-card">
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account</p>

      <form id="loginForm" novalidate>
        <!-- Login As Field -->
        <div class="auth-form-group">
          <label for="loginAs">Login As</label>
          <div class="auth-input-wrapper">
            <i class="fa-regular fa-user auth-input-icon"></i>
            <select id="loginAs" class="auth-select" required>
              <option value="Client" selected>Client</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
        </div>

        <!-- Email Address Field -->
        <div class="auth-form-group">
          <label for="loginEmail">Email Address</label>
          <div class="auth-input-wrapper">
            <i class="fa-regular fa-envelope auth-input-icon"></i>
            <input type="email" id="loginEmail" class="auth-input" placeholder="user@example.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password Field -->
        <div class="auth-form-group" style="position: relative;">
          <label for="loginPassword">Password</label>
          <a href="404.html" class="auth-forgot-link">Forgot password?</a>
          <div class="auth-input-wrapper">
            <i class="fa-solid fa-lock auth-input-icon"></i>
            <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
            <span class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </span>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-submit-btn">Login</button>
      </form>

      <!-- Switch to Signup -->
      <p class="auth-switch-text">
        Don't have an account? <a href="Signup.html">Create an account</a>
      </p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="auth.js"></script>
</body>
</html>
